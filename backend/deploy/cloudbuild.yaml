# Cloud Build → Artifact Registry → Cloud Run.
#
# Wire this to a GitHub trigger with the build context set to backend/:
#   gcloud builds triggers create github \
#     --repo-name=kadai --repo-owner=<owner> --branch-pattern='^main$' \
#     --build-config=backend/deploy/cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_SERVICE=kadai-api,_CORS_ORIGINS=https://app.example.com
#
# Secrets are NOT set here — deploy.sh (or a one-time `gcloud run services
# update --set-secrets`) owns them, so a rebuild never rewrites them.

substitutions:
  _REGION: asia-south1
  _SERVICE: kadai-api
  _REPO: kadai
  _WA_MODE: cloud
  _CORS_ORIGINS: ""
  _FRONTEND_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"]

  # See deploy.sh for why the instance count is pinned and CPU is never throttled.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--region=${_REGION}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--no-cpu-throttling"
      - "--min-instances=1"
      - "--max-instances=1"
      - "--session-affinity"
      - "--timeout=3600"
      - "--set-env-vars=^;^APP_ENV=production;JSON_LOGS=true;WA_MODE=${_WA_MODE};RUN_MIGRATIONS=true;SEED_DEMO_DATA=false;CORS_ORIGINS=${_CORS_ORIGINS};FRONTEND_URL=${_FRONTEND_URL}"
